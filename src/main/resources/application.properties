spring.application.name=sunrise-dental-clinic
server.port=8080

# ---------------------------------------------------------------
# MySQL connection
# PUT YOUR OWN MySQL USERNAME AND PASSWORD ON THE TWO LINES BELOW
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_dental_clinic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# ---------------------------------------------------------------
# Demonstration accounts.
# These are only created when the users table is empty.
# Change the passwords here before your demonstration if you wish.
# ---------------------------------------------------------------
app.demo.data-enabled=true
app.demo.admin-password=Admin@123
app.demo.receptionist-password=Reception@123
app.demo.dentist-password=Dentist@123
