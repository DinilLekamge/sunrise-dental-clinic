<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Treatments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Treatments</h1>
        <a class="btn btn-primary" th:href="@{/treatments/new}">Add treatment</a>
    </div>

    <table class="table table-striped bg-white">
        <thead>
        <tr>
            <th>Treatment ID</th>
            <th>Treatment name</th>
            <th class="text-end">Treatment fee</th>
            <th class="text-end">Consultation fee</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="treatment : ${treatments}">
            <td th:text="${treatment.id}">1</td>
            <td th:text="${treatment.treatmentName}">Filling</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(treatment.treatmentFee, 1, 2)}">0.00</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(treatment.consultationFee, 1, 2)}">0.00</td>
            <td>
                <span class="badge text-bg-success" th:if="${treatment.active}">Active</span>
                <span class="badge text-bg-secondary" th:unless="${treatment.active}">Inactive</span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{'/treatments/' + ${treatment.id} + '/edit'}">Edit</a>
                <form class="d-inline" method="post" th:action="@{'/treatments/' + ${treatment.id} + '/toggle'}"
                      onsubmit="return confirmAction('Change the active status of this treatment?');">
                    <button class="btn btn-sm btn-outline-secondary" type="submit"
                            th:text="${treatment.active} ? 'Deactivate' : 'Activate'">Deactivate</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(treatments)}">
            <td colspan="6" class="text-center text-muted">No treatments have been added yet.</td>
        </tr>
        </tbody>
    </table>
</div>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
