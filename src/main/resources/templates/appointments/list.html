<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Appointments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Appointments</h1>
        <a class="btn btn-primary" th:href="@{/appointments/new}" sec:authorize="hasRole('RECEPTIONIST')">
            Register appointment
        </a>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <form class="row g-2" method="get" th:action="@{/appointments/search}">
                <div class="col-auto">
                    <input class="form-control" type="text" name="number" placeholder="Appointment number">
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-secondary" type="submit">Search by number</button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <form class="row g-2 justify-content-end" method="get" th:action="@{/appointments}">
                <div class="col-auto">
                    <select class="form-select" name="dentistId">
                        <option value="">All dentists</option>
                        <option th:each="dentist : ${dentists}"
                                th:value="${dentist.id}"
                                th:text="${dentist.name}"
                                th:selected="${dentist.id == selectedDentistId}">Dentist</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-secondary" type="submit">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped bg-white">
        <thead>
        <tr>
            <th>Appointment number</th>
            <th>Patient</th>
            <th>Dentist</th>
            <th>Treatment</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appointment : ${appointments}">
            <td th:text="${appointment.appointmentNumber}">APT-0001</td>
            <td th:text="${appointment.patient.name}">Patient</td>
            <td th:text="${appointment.dentist.name}">Dentist</td>
            <td th:text="${appointment.treatment.treatmentName}">Treatment</td>
            <td th:text="${appointment.appointmentDate}">2026-01-01</td>
            <td th:text="${appointment.appointmentTime}">09:00</td>
            <td th:text="${appointment.status}">SCHEDULED</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{'/appointments/' + ${appointment.id}}">View</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(appointments)}">
            <td colspan="8" class="text-center text-muted">No appointments to show.</td>
        </tr>
        </tbody>
    </table>
</div>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
