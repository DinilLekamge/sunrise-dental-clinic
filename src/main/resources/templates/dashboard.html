<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-1">Dashboard</h1>
    <p class="text-muted">Signed in as <span sec:authentication="name">user</span>.</p>

    <div class="row g-3 mt-2">
        <div class="col-md-4" sec:authorize="hasAnyRole('RECEPTIONIST','DENTIST')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Patients</h2>
                    <p class="display-6 mb-2" th:text="${patientCount}">0</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/patients}">Open patients</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('RECEPTIONIST','DENTIST')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Appointments</h2>
                    <p class="display-6 mb-2" th:text="${appointmentCount}">0</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/appointments}">Open appointments</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('RECEPTIONIST')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Bills</h2>
                    <p class="display-6 mb-2" th:text="${billCount}">0</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/billing}">Open billing</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Dentists</h2>
                    <p class="display-6 mb-2" th:text="${dentistCount}">0</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/dentists}">Manage dentists</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Treatments</h2>
                    <p class="display-6 mb-2" th:text="${treatmentCount}">0</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/treatments}">Manage treatments</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Reports</h2>
                    <p class="text-muted">Appointment and billing reports.</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/reports/appointments}">Open reports</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
