<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' - Sunrise Dental Clinic'">Sunrise Dental Clinic</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg clinic-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sunrise Dental Clinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RECEPTIONIST','DENTIST')">
                    <a class="nav-link" th:href="@{/patients}">Patients</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RECEPTIONIST','DENTIST')">
                    <a class="nav-link" th:href="@{/appointments}">Appointments</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('RECEPTIONIST')">
                    <a class="nav-link" th:href="@{/billing}">Billing</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/dentists}">Dentists</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/treatments}">Treatments</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/users}">Users</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
                    <a class="nav-link" th:href="@{/reports/appointments}">Reports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/help}">Help</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-text text-white-50" sec:authentication="name">user</span>
                <span class="badge text-bg-light" sec:authorize="hasRole('ADMIN')">Administrator</span>
                <span class="badge text-bg-light" sec:authorize="hasRole('RECEPTIONIST')">Receptionist</span>
                <span class="badge text-bg-light" sec:authorize="hasRole('DENTIST')">Dentist</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="messages">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
