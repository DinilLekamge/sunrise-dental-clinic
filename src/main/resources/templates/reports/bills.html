<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Billing report')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Billing report</h1>
        <a class="btn btn-outline-secondary" th:href="@{/reports/appointments}">Appointment report</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/reports/bills}">
        <div class="col-auto">
            <label class="form-label" for="from">From</label>
            <input class="form-control" id="from" type="date" name="from" th:value="${from}">
        </div>
        <div class="col-auto">
            <label class="form-label" for="to">To</label>
            <input class="form-control" id="to" type="date" name="to" th:value="${to}">
        </div>
        <div class="col-auto align-self-end">
            <button class="btn btn-primary" type="submit">Apply filter</button>
            <a class="btn btn-link" th:href="@{/reports/bills}">Show all</a>
        </div>
    </form>

    <table class="table table-bordered bg-white">
        <thead>
        <tr>
            <th>Bill number</th>
            <th>Appointment number</th>
            <th>Patient</th>
            <th>Treatment</th>
            <th class="text-end">Total amount</th>
            <th>Generated date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="bill : ${bills}">
            <td th:text="${bill.billNumber}">BILL-0001</td>
            <td th:text="${bill.appointment.appointmentNumber}">APT-0001</td>
            <td th:text="${bill.appointment.patient.name}">Patient</td>
            <td th:text="${bill.appointment.treatment.treatmentName}">Treatment</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(bill.totalAmount, 1, 2)}">0.00</td>
            <td th:text="${bill.generatedAtText}">2026-01-01 10:00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(bills)}">
            <td colspan="6" class="text-center text-muted">No bills match this filter.</td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted">Total bills listed: <span th:text="${#lists.size(bills)}">0</span></p>
</div>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
